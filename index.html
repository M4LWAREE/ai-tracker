<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Flex Life" />
  <meta name="theme-color" content="#efe7d6" />
  <title>Flex Life</title>
  <script>
    // Self-update: on open / foreground, check the live build and reload if newer.
    const BUILD = "4";
    async function checkUpdate() {
      try {
        const res = await fetch('version.txt?cb=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return;
        const latest = (await res.text()).trim();
        if (latest && latest !== BUILD) location.replace('./?v=' + encodeURIComponent(latest));
      } catch (e) {}
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkUpdate();
    });
    window.addEventListener('pageshow', checkUpdate);
    checkUpdate();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --paper: #efe7d6;
      --paper-2: #f7f2e8;
      --ink: #16130d;
      --lime: #c6fb1e;
      --coral: #ff4d2e;
      --shadow: 5px 5px 0 var(--ink);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 18px);
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
    }
    .display {
      font-family: "Anton", Impact, "Haettenschweiler", "Arial Narrow", sans-serif;
      font-weight: 400;
      letter-spacing: .01em;
      text-transform: uppercase;
    }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }

    /* Header */
    header { padding: 26px 0 6px; display: flex; align-items: flex-start; justify-content: space-between; }
    .brand { line-height: .82; }
    .brand .display { font-size: 58px; }
    .brand .life { background: var(--lime); padding: 0 8px; margin-left: -2px; box-decoration-break: clone; }
    .datebox {
      text-align: right; border: 2.5px solid var(--ink); background: var(--paper-2);
      padding: 7px 10px; box-shadow: 3px 3px 0 var(--ink); max-width: 128px;
    }
    .datebox .tag { display: block; opacity: .6; }
    .datebox .d { font-weight: 700; font-size: 13px; margin-top: 3px; line-height: 1.15; }

    /* Hero */
    .hero {
      border: 3px solid var(--ink); background: var(--ink); color: var(--paper);
      box-shadow: var(--shadow); padding: 20px 20px 22px; margin-top: 18px;
    }
    .hero .tag { color: var(--lime); }
    .bignum { display: flex; align-items: baseline; gap: 12px; margin: 2px 0 4px; }
    .bignum .n { font-size: 92px; line-height: .8; color: var(--lime); }
    .bignum .u { font-size: 20px; opacity: .85; }
    .sub { font-size: 13px; font-weight: 500; letter-spacing: .04em; opacity: .82; text-transform: uppercase; }
    .bar {
      margin-top: 16px; height: 20px; background: #2c281d;
      border: 2.5px solid var(--paper); position: relative; overflow: hidden;
    }
    .bar .fill { height: 100%; width: 0; background: var(--lime); transition: width .35s ease; }

    /* Stats */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .stat { border: 2.5px solid var(--ink); background: var(--paper-2); box-shadow: 3px 3px 0 var(--ink); padding: 12px 14px; }
    .stat .v { font-size: 30px; line-height: 1; }
    .stat .k { margin-top: 5px; opacity: .6; }

    /* Form */
    form { margin-top: 20px; display: grid; grid-template-columns: 1fr; gap: 10px; }
    .frow { display: flex; gap: 10px; }
    input {
      font-family: inherit; font-size: 16px; font-weight: 500; color: var(--ink);
      background: var(--paper-2); border: 2.5px solid var(--ink); padding: 14px;
      box-shadow: 3px 3px 0 var(--ink); width: 100%; border-radius: 0;
    }
    input::placeholder { color: rgba(22,19,13,.42); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
    input:focus { outline: none; background: #fff; box-shadow: 3px 3px 0 var(--lime), 0 0 0 2.5px var(--ink); }
    input#kcal { flex: 0 0 108px; }
    button.add {
      flex: 1; font-family: "Anton", Impact, sans-serif; text-transform: uppercase; letter-spacing: .04em;
      font-size: 22px; color: var(--ink); background: var(--lime); border: 2.5px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink); cursor: pointer; padding: 12px; border-radius: 0;
    }
    button.add:active { transform: translate(3px, 3px); box-shadow: none; }

    /* List */
    .listhead { margin-top: 26px; display: flex; align-items: center; gap: 10px; }
    .listhead .line { flex: 1; height: 3px; background: var(--ink); }
    ul { list-style: none; padding: 0; margin: 10px 0 0; }
    li {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 2.5px solid var(--ink); padding: 15px 2px;
    }
    li .name { font-size: 17px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
    li .right { display: flex; align-items: center; gap: 14px; }
    li .kcal { font-family: "Anton", Impact, sans-serif; font-size: 20px; }
    li button.del {
      width: 30px; height: 30px; border: 2.5px solid var(--ink); background: var(--paper);
      color: var(--ink); font-size: 16px; line-height: 1; cursor: pointer; border-radius: 0;
    }
    li button.del:active { background: var(--coral); color: #fff; }
    .empty { border-bottom: none; opacity: .55; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; padding: 26px 0; }

    footer { margin-top: 30px; text-align: center; }
    footer .tag { opacity: .5; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="display">Flex</div>
      <div class="display"><span class="life">Life</span></div>
    </div>
    <div class="datebox">
      <span class="tag">Today</span>
      <div class="d" id="date"></div>
    </div>
  </header>

  <section class="hero">
    <span class="tag">Fuel Logged</span>
    <div class="bignum">
      <span class="n display" id="consumed">0</span>
      <span class="u display">Kcal</span>
    </div>
    <div class="sub"><span id="remaining">2000</span> left of <span id="goal">2000</span> goal</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </section>

  <div class="stats">
    <div class="stat"><div class="v display" id="goal2">2000</div><div class="k tag">Daily goal</div></div>
    <div class="stat"><div class="v display" id="count">0</div><div class="k tag">Items logged</div></div>
  </div>

  <form id="form">
    <input id="food" type="text" placeholder="What did you eat" autocomplete="off" />
    <div class="frow">
      <input id="kcal" type="number" placeholder="kcal" inputmode="numeric" min="0" />
      <button class="add" type="submit">Add</button>
    </div>
  </form>

  <div class="listhead">
    <span class="tag">Today&rsquo;s log</span>
    <span class="line"></span>
  </div>
  <ul id="list"></ul>

  <footer>
    <span class="tag">A Parag Nanday, Dron Prajapati &amp; Manraj (idk last name) project</span>
  </footer>

  <script>
    const GOAL = 2000;
    const key = 'ct-' + new Date().toISOString().slice(0, 10);
    let items = JSON.parse(localStorage.getItem(key) || '[]');
    const $ = (id) => document.getElementById(id);

    function save() { localStorage.setItem(key, JSON.stringify(items)); }

    function render() {
      const total = items.reduce((s, i) => s + i.kcal, 0);
      $('consumed').textContent = total;
      $('goal').textContent = GOAL;
      $('goal2').textContent = GOAL;
      $('remaining').textContent = Math.max(0, GOAL - total);
      $('count').textContent = items.length;

      const pct = Math.min(1, total / GOAL);
      const fill = $('fill');
      fill.style.width = (pct * 100) + '%';
      fill.style.background = total > GOAL ? 'var(--coral)' : 'var(--lime)';

      const list = $('list');
      list.innerHTML = '';
      if (items.length === 0) {
        list.innerHTML = '<li class="empty">Nothing logged yet &mdash; add your first fuel</li>';
        return;
      }
      items.forEach((it, idx) => {
        const li = document.createElement('li');
        li.innerHTML =
          '<span class="name">' + escapeHtml(it.name) + '</span>' +
          '<span class="right"><span class="kcal">' + it.kcal + '</span>' +
          '<button class="del" aria-label="Remove">&times;</button></span>';
        li.querySelector('.del').addEventListener('click', () => {
          items.splice(idx, 1); save(); render();
        });
        list.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('food').value.trim();
      const kcal = parseInt($('kcal').value, 10);
      if (!name || !kcal || kcal < 0) return;
      items.push({ name, kcal });
      save();
      $('food').value = '';
      $('kcal').value = '';
      $('food').focus();
      render();
    });

    $('date').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'short', month: 'short', day: 'numeric'
    });
    render();
  </script>
</body>
</html>
