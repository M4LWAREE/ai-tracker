<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Calorie Tracker" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Calorie Tracker</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --line: #223049;
      --text: #eaf0fb;
      --muted: #8ea1c0;
      --accent: #4ade80;
      --danger: #ff6b6b;
      --track: #1c2740;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom);
      display: flex;
      flex-direction: column;
      min-height: 100%;
    }
    header { padding-top: 28px; }
    h1 { font-size: 28px; margin: 0; letter-spacing: -.02em; }
    .date { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

    .ring-wrap { display: flex; justify-content: center; margin: 26px 0 4px; }
    .ring { position: relative; width: 200px; height: 200px; }
    .ring svg { transform: rotate(-90deg); }
    .ring .center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .ring .num { font-size: 44px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .ring .label { color: var(--muted); font-size: 13px; margin-top: 6px; }

    .stats { display: flex; gap: 12px; margin-top: 18px; }
    .stat {
      flex: 1; background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px; text-align: center;
    }
    .stat .v { font-size: 20px; font-weight: 700; }
    .stat .k { color: var(--muted); font-size: 12px; margin-top: 2px; }

    form {
      display: flex; gap: 10px; margin-top: 22px;
    }
    input {
      background: var(--card); border: 1px solid var(--line); color: var(--text);
      border-radius: 12px; padding: 14px; font-size: 16px; width: 100%;
    }
    input#food { flex: 2; }
    input#kcal { flex: 1; min-width: 0; }
    input::placeholder { color: var(--muted); }
    input:focus { outline: none; border-color: var(--accent); }
    button.add {
      background: var(--accent); color: #06210f; border: none; font-weight: 700;
      border-radius: 12px; padding: 0 18px; font-size: 22px; cursor: pointer;
    }

    ul { list-style: none; padding: 0; margin: 18px 0 0; }
    li {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    }
    li .name { font-weight: 600; }
    li .kcal { color: var(--muted); font-size: 14px; }
    li .right { display: flex; align-items: center; gap: 14px; }
    li button.del {
      background: none; border: none; color: var(--danger); font-size: 20px;
      cursor: pointer; padding: 0; line-height: 1;
    }
    .empty { color: var(--muted); text-align: center; padding: 30px 0; }
    .credit { margin-top: auto; padding: 26px 0 10px; text-align: center; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Calorie Tracker</h1>
    <p class="date" id="date"></p>
  </header>

  <div class="ring-wrap">
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="88" fill="none" stroke="var(--track)" stroke-width="16" />
        <circle id="arc" cx="100" cy="100" r="88" fill="none" stroke="var(--accent)"
                stroke-width="16" stroke-linecap="round"
                stroke-dasharray="552.9" stroke-dashoffset="552.9" />
      </svg>
      <div class="center">
        <div class="num" id="consumed">0</div>
        <div class="label">of <span id="goal">2000</span> kcal</div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="v" id="remaining">2000</div><div class="k">Remaining</div></div>
    <div class="stat"><div class="v" id="count">0</div><div class="k">Items</div></div>
  </div>

  <form id="form">
    <input id="food" type="text" placeholder="Food" autocomplete="off" />
    <input id="kcal" type="number" placeholder="kcal" inputmode="numeric" min="0" />
    <button class="add" type="submit" aria-label="Add">+</button>
  </form>

  <ul id="list"></ul>

  <p class="credit">A Parag Nanday, Dron Prajapati &amp; Manraj project.</p>

  <script>
    const GOAL = 2000;
    const CIRC = 2 * Math.PI * 88;
    const key = 'ct-' + new Date().toISOString().slice(0, 10);
    let items = JSON.parse(localStorage.getItem(key) || '[]');

    const $ = (id) => document.getElementById(id);

    function save() { localStorage.setItem(key, JSON.stringify(items)); }

    function render() {
      const total = items.reduce((s, i) => s + i.kcal, 0);
      $('consumed').textContent = total;
      $('goal').textContent = GOAL;
      $('remaining').textContent = Math.max(0, GOAL - total);
      $('count').textContent = items.length;

      const pct = Math.min(1, total / GOAL);
      $('arc').style.strokeDashoffset = CIRC * (1 - pct);
      $('arc').setAttribute('stroke', total > GOAL ? 'var(--danger)' : 'var(--accent)');

      const list = $('list');
      list.innerHTML = '';
      if (items.length === 0) {
        list.innerHTML = '<li class="empty">No food logged yet</li>';
        return;
      }
      items.forEach((it, idx) => {
        const li = document.createElement('li');
        li.innerHTML =
          '<span class="name">' + escapeHtml(it.name) + '</span>' +
          '<span class="right"><span class="kcal">' + it.kcal + ' kcal</span>' +
          '<button class="del" aria-label="Remove">&times;</button></span>';
        li.querySelector('.del').addEventListener('click', () => {
          items.splice(idx, 1); save(); render();
        });
        list.appendChild(li);
      });
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    $('form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('food').value.trim();
      const kcal = parseInt($('kcal').value, 10);
      if (!name || !kcal || kcal < 0) return;
      items.push({ name, kcal });
      save();
      $('food').value = '';
      $('kcal').value = '';
      $('food').focus();
      render();
    });

    $('date').textContent = new Date().toLocaleDateString(undefined, {
      weekday: 'long', month: 'long', day: 'numeric'
    });
    render();
  </script>
</body>
</html>
